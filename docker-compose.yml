services:
  passagem:
    build: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8090}:3000"
    environment:
      ADMIN_PIN: ${ADMIN_PIN:?defina ADMIN_PIN nas variáveis da stack}
      ROOM_TTL_HOURS: ${ROOM_TTL_HOURS:-24}
      MAX_FILE_MB: ${MAX_FILE_MB:-500}
      MAX_ROOM_MB: ${MAX_ROOM_MB:-2048}
    volumes:
      - passagem-data:/data

volumes:
  passagem-data:
